name: Publish to npm

# Publishes stable product releases only (tag vX.Y.Z), or on manual dispatch
# with an exact stable version tag selected. Audit prereleases are excluded.
# Authentication is npm Trusted Publishing (OIDC): the
# job mints a short-lived identity token from GitHub and npm verifies it against
# the trusted publisher configured on the package — so there is no long-lived
# NPM_TOKEN secret to manage or leak, and provenance is attached automatically.
#
# One-time setup on npmjs.com (package owner): inkcheck > Settings >
# "Trusted Publisher" > GitHub Actions, with:
#   Organization/user: chaoz23
#   Repository:        inkcheck
#   Workflow filename: publish.yml
#   Environment:       (leave blank unless you add one below)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == false && startsWith(github.event.release.tag_name, 'v')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Validate product release identity
        run: node scripts/release-event-gate.js publish
      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      # No NODE_AUTH_TOKEN: npm exchanges the OIDC token for a short-lived
      # publish credential via the configured trusted publisher.
      - run: npm publish
